server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # The front controller is the only PHP file the web server runs, which is
    # what keeps src/ unreachable from the outside.
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Nothing under src/ or vendor/ is a document, so it is not served at all.
    location ~ ^/(src|vendor|storage)/ {
        deny all;
        return 404;
    }

    location ~ /\\. {
        deny all;
    }
}
