# nginx for the Empira application, talking to php-fpm.
#
# One file, bind-mounted into a stock `nginx:alpine`. There is no image to build
# and no configuration baked anywhere: nginx is told where the code is, and that
# is the whole of the arrangement.
#
# The two settings that are easy to get wrong, and what happens when they are:
#
#   `root`      must be `public/`, not the project root. With the project root,
#               every file outside it — composer.json, .env, the source — is
#               served as a download.
#   SCRIPT_FILENAME  must be the *resolved* path, which is why it goes through
#               `$document_root`. Passing a literal path that nginx does not then
#               mount produces "File not found." from php-fpm, which reads like a
#               permissions problem and is not one.

server {
    listen 80;
    server_name _;

    # Resolve service names at request time, not at startup.
    #
    # 127.0.0.11 is Docker's embedded DNS. nginx resolves a *literal* upstream
    # name once, while it parses its config — and at that moment `php` does not
    # always resolve yet, because Docker registers a service's DNS alias when the
    # container is attached to the network, which can be after the dependent
    # container has started. `depends_on` narrows the window; it does not close
    # it. The symptom is nginx exiting with
    #
    #     [emerg] host not found in upstream "php"
    #
    # on the first `up` and working on the second, which is the worst kind of
    # bug to have in a stack whose selling point is that it always comes up.
    #
    # A variable in fastcgi_pass makes the lookup happen per request instead, by
    # which time the alias is definitely there. `valid=30s` re-resolves rather
    # than holding a container's IP past its replacement, so a `php` restart is
    # picked up without restarting nginx.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # The application's own directory, not the project root. This line is the
    # security boundary; everything above it is plumbing.
    root /workspace/app/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # A static file is served by nginx; everything else is PHP. `try_files` with
    # a `$uri/` fallback is what makes the front controller reachable for every
    # path the application routes, rather than only for those that happen to
    # exist on disk.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        set $php_fpm "php:9000";
        fastcgi_pass $php_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           $https if_not_empty;

        # The htmx framework streams some responses, and a buffer that never
        # fills turns a streaming endpoint into a hanging one.
        fastcgi_buffering off;
    }

    # Only index.php is ever executed. Without this a request for
    # `/anything.php` that happened to exist would be run as PHP — which is how
    # an uploaded file becomes a shell.
    location ~ \.php$ {
        return 404;
    }

    # Dotfiles: .env above all. nginx would serve it as text, and it holds the
    # secret that signs every component token.
    location ~ /\. {
        deny all;
    }
}
