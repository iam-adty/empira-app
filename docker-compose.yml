# The reference application, runnable.
#
#     docker compose up --build      # http://localhost:8080
#     docker compose down -v
#
# nginx serves the document and hands PHP to php-fpm, which is how it would be
# deployed for real. The database is PostgreSQL rather than SQLite so the
# grammar layer is exercised by the demo and not only by the test suite.
#
# The demo's authentication is App\Auth\DemoGuard, which trusts a query string.
# It is a demonstration of the wiring, not authentication — read its docblock
# before copying anything here.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: empira
      POSTGRES_PASSWORD: empira
      POSTGRES_DB: empira_app
    tmpfs:
      # PostgreSQL 18 places its cluster here; the older `data` subdirectory
      # layout makes the image refuse to start.
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empira -d empira_app"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      # The workspace root, because the framework is an unpublished path
      # package that has to be in the build context. See the Dockerfile.
      context: ..
      dockerfile: app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      # Generate a real one for anything that is not a demo.
      APP_SECRET: dev-secret-change-me-please-32b
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: empira_app
      DB_USERNAME: empira
      DB_PASSWORD: empira
    volumes:
      # The source is mounted so an edit needs no rebuild.
      - .:/var/www/html
      # …and vendor/ is not shadowed by that mount, or a fresh clone would have
      # no dependencies at all.
      - vendor:/var/www/html/vendor

  web:
    image: nginx:1.29-alpine
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  vendor:
