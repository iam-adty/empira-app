# The reference application, running under nginx + php-fpm.
#
#     docker compose -f app up -d          # http://localhost:8080
#     docker compose -f app down -v
#
# ## No image, and why that is the point
#
# Both server images are stock — `nginx:alpine` and `php:8.4-fpm-alpine` — and
# the workspace is bind-mounted. Nothing is built, so nothing has to be
# rebuilt: an edit under `app/src` is an edit in the running container, and so is
# one under a sibling library's `src`.
#
# That is a different property from the FrankenPHP image this replaces. There, a
# library change meant a rebuild or a hand-written override file that was easy to
# forget; here the mount is the mechanism, and it cannot be forgotten because
# there is nothing to forget.
#
# ## The one sharp edge: pdo_pgsql
#
# A stock `php:8.4-fpm-alpine` has `pdo_sqlite` and **not** `pdo_pgsql`, and
# without an image build you cannot `docker-php-ext-install` it. The Alpine
# package installs but does not load, because it places `pdo_pgsql.so` under
# `/usr/lib/php84/modules` while the official image's PHP scans
# `/usr/local/lib/php/extensions/...`.
#
# The fix is an explicit `-d extension=` flag on the `php-fpm` binary. Extensions
# are loaded when the SAPI starts, so this has to be a command-line flag and not a
# pool setting — `php_admin_value[extension]` in the pool config is too late and
# is silently ignored. Verified, rather than assumed:
#
#     $ php-fpm -m | grep pdo_pgsql                                    # nothing
#     $ php-fpm -d extension=/usr/lib/php84/modules/pdo_pgsql.so -m     # pdo_pgsql
#
# The `php` service re-checks that at start and refuses to serve without it,
# because a missing driver otherwise surfaces as a failed query on the first
# request rather than as a startup error.
#
# ## Migrations
#
# Run by the `php` service on start, before anything serves. Not by the
# application: an fpm pool may run several workers, and a boot that migrates is
# several workers racing through the same migration. This is a compromise a
# single container forces — once per container start, not once per deploy — and a
# migration that genuinely must run exactly once belongs in a deploy job that
# finishes before this comes up.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: empira
      POSTGRES_PASSWORD: empira
      POSTGRES_DB: empira_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empira -d empira_app"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql

  php:
    image: php:8.4-fpm-alpine
    depends_on:
      db:
        condition: service_healthy
    working_dir: /workspace/app
    volumes:
      # Source and libraries in one mount: the workspace, mounted at the same
      # path the host uses, so error messages and stack traces read identically
      # inside the container and outside it.
      - ..:/workspace
      # apk's own package cache. This is the one thing worth persisting here, and
      # it is worth persisting for a specific reason: `apk` writes the unpacked
      # module into the *container filesystem*, which does not survive the
      # container. An earlier version of this file cached a "done" marker in a
      # volume instead, and the marker outlived the files it claimed were
      # installed — so the second `up` skipped the install and refused to serve.
      # Caching the package makes `apk` fast without making it lie.
      - apk-cache:/var/cache/apk
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_SECRET: "${APP_SECRET:-dev-secret-change-me-please-32b}"
      REGISTRATION: "${REGISTRATION:-open}"
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: empira_app
      DB_USERNAME: empira
      DB_PASSWORD: empira
    command:
      - sh
      - -c
      - |
        set -e
        ext=/usr/lib/php84/modules/pdo_pgsql.so
        # No --no-cache: the package cache is a mounted volume, so this hits the
        # network once and then unpacks from disk — about 0.9s instead of 61s,
        # measured. The unpack still happens every time, into the container
        # filesystem, which is the part that has to be true.
        apk add php84-pdo_pgsql >/dev/null
        # Refuse to serve rather than fail on the first query, which is where a
        # missing extension is hardest to diagnose.
        php -d extension=$$ext -r 'exit(extension_loaded("pdo_pgsql") ? 0 : 1);' \
          || { echo "empira: pdo_pgsql unavailable; refusing to serve." >&2; exit 1; }
        # vendor/ comes from the host, because these images have no Composer and
        # a container that fetched its own dependencies would disagree with the
        # lock file the host is holding.
        [ -f vendor/autoload.php ] || {
          echo "empira: app/vendor is missing. Run 'composer install' in app/ first." >&2
          exit 1; }
        # The flag again, and not by accident: the CLI is a different SAPI from
        # fpm and does not inherit its flags. Without this the driver is present
        # for every request and absent for the migration, which is a confusing
        # way to discover it — the first failure is a connection error with no
        # mention of extensions at all.
        php -d extension=$$ext vendor/bin/empira migrate
        exec php-fpm -d extension=$$ext --nodaemonize
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:alpine
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ..:/workspace:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  db-data:
  apk-cache: