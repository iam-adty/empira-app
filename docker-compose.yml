# The reference application, runnable.
#
#     docker compose up --build      # http://localhost:8080
#     docker compose down -v
#
# FrankenPHP serves the document and the PHP in one process, in worker mode:
# the application boots once and keeps serving from memory. The database is
# PostgreSQL rather than SQLite so the grammar layer is exercised by the demo
# and not only by the test suite.
#
# Authentication is real — App\Auth\UserRepository plus the framework's
# SessionGuard, signed in through the login form. The seeded account is
# ada@example.com / "correct horse battery staple".

services:
  db:
    image: postgres:18-alpine
    container_name: empira-db
    environment:
      POSTGRES_USER: empira
      POSTGRES_PASSWORD: empira
      POSTGRES_DB: empira_app
    tmpfs:
      # PostgreSQL 18 places its cluster here; the older `data` subdirectory
      # layout makes the image refuse to start.
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empira -d empira_app"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      # The workspace root, because the framework is an unpublished path
      # package that has to be in the build context. See the Dockerfile.
      context: ..
      dockerfile: app/Dockerfile
    # Named rather than left to Compose, which would call it `app-app`.
    image: empira/app
    container_name: empira-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Replaces the base image's own check, which curls Caddy's admin endpoint
      # on :2019 — and `php-server run` disables that endpoint, so it can never
      # pass. It also asked the wrong question: the admin port being open says
      # nothing about whether PHP is serving. This one asks that.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/login || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      # Worker boot runs migrations and the seeder's bcrypt, so the first
      # request is not instant. Without this the container is declared dead
      # before it has finished starting.
      start_period: 20s
    environment:
      APP_ENV: local
      # Generate a real one for anything that is not a demo.
      APP_SECRET: dev-secret-change-me-please-32b
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: empira_app
      DB_USERNAME: empira
      DB_PASSWORD: empira
      # Worker mode: one boot, many requests. Set to `classic` to run the front
      # controller afresh per request instead.
      APP_RUNTIME: worker
      # PHP was not built to run forever, so the worker is recycled every so
      # often rather than accumulating whatever third-party code leaks.
      MAX_REQUESTS: "500"
      # Empty means FrankenPHP's own default: two workers per CPU. Set to 1 to
      # force every request through one process, which is how you prove
      # something about state carrying between them.
      FRANKENPHP_WORKERS: "${FRANKENPHP_WORKERS:-}"
    volumes:
      # The **workspace** is mounted, not just this package, so the layout inside
      # the container matches the host — which is what lets one relative path
      # find the shared `tmp/` from either side.
      - ..:/workspace
      # …and vendor/ is not shadowed by that mount, or a fresh clone would have
      # no dependencies at all.
      - vendor:/workspace/app/vendor
      # The framework's source, live, over the copy the image baked in.
      #
      # Without this the image's copy wins and verifying a framework edit means
      # rebuilding the image — minutes per check, which is how "just rebuild it"
      # becomes the path of least resistance. The autoloader is PSR-4 (no
      # `optimize-autoloader`, no authoritative classmap), so this needs no
      # autoload regeneration: edits resolve, and so do new files.
      #
      # Mounted deeper than the volume above, so Docker applies it last.
      - ../principle/src:/workspace/app/vendor/iam-adty/empira-principle/src

volumes:
  vendor:
